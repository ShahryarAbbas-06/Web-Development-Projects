<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="page2.css">
    <link rel="icon" href="netflix.png">
    <!-- Took help from AI to add a Favicon -->
</head>
<body>
    <div class="sign">
        <h2>Sign Up</h2> 
        <form>
            <label for="email">Email Address
                <input class="In1" type="email" placeholder="name@example.com" required>
            </label>
            <label for="password">Password
                <input class="In2" type="password" required>
            </label>
        </form>
        <button type="submit" class="btn">Sign In </button>
        <div class="rememberme">
        <label>
            <input class="In3" type="checkbox">Remember Me
        </label>
        </div>
    </div>
</body>
</html>
